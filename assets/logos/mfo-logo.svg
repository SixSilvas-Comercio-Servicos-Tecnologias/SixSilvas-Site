<svg role="img" aria-label="Logo MinhaFarmaciaOnline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <title>MinhaFarmaciaOnline - MFO</title>

  <!-- Carrinho de compras -->
  <g id="cart" stroke="#1F9D8F" stroke-width="2.5" fill="none">
    <path d="M 10 15 L 15 15 L 20 40 L 50 40"/>
    <circle cx="25" cy="50" r="3" fill="#1F9D8F"/>
    <circle cx="45" cy="50" r="3" fill="#1F9D8F"/>
  </g>

  <!-- Cápsula/pílula -->
  <g id="pill">
    <ellipse cx="35" cy="25" rx="12" ry="8" fill="#F2994A" opacity="0.9"/>
    <ellipse cx="42" cy="22" rx="10" ry="7" fill="#1F9D8F" opacity="0.9"/>
    <path d="M 30 25 L 45 20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Símbolo + (cruz médica) -->
  <g id="plus" fill="#1F9D8F">
    <rect x="48" y="28" width="3" height="10" rx="1"/>
    <rect x="44" y="32" width="10" height="3" rx="1"/>
  </g>

  <!-- Texto MFO -->
  <text x="70" y="35" font-family="Poppins, sans-serif" font-size="30" font-weight="700" fill="#1F9D8F">
    MFO
  </text>

  <!-- Texto MinhaFarmaciaOnline -->
  <text x="70" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#F2994A">
    Minha
  </text>
  <text x="115" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1F9D8F">
    Farmacia
  </text>
  <text x="180" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4F4F4F">
    Online
  </text>
</svg>
